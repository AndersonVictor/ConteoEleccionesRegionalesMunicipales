# Puerta de entrada: sirve la PWA y reparte /api entre los microservicios.
worker_processes auto;
events { worker_connections 8192; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 1m;
  # Un acta completa pesa decenas de KB: se maneja en memoria, sin archivos temporales.
  client_body_buffer_size 512k;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 512;
  gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

  # Límite general por IP. Es holgado porque en redes móviles muchos celulares comparten IP.
  limit_req_zone $binary_remote_addr zone=api:20m rate=100r/s;

  # Docker resuelve cada nombre a todas sus réplicas.
  upstream auth       { server auth:3000;       keepalive 32; }
  upstream conteo     { server conteo:3000;     keepalive 64; }
  upstream resultados { server resultados:3000; keepalive 32; }

  server {
    listen 80;
    root /usr/share/nginx/html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503;

    # Usuarios: registro, ingreso, consulta de DNI y administración de personeros.
    location ~ ^/api/(auth/|me$|dni/|admin/usuarios) {
      limit_req zone=api burst=200 nodelay;
      proxy_pass http://auth;
    }
    # Resultados: solo lectura, con caché.
    location ^~ /api/dashboard {
      limit_req zone=api burst=200 nodelay;
      proxy_pass http://resultados;
    }
    # Todo lo demás de la API: mesas, actas, organizaciones, ubigeo.
    location /api/ {
      limit_req zone=api burst=200 nodelay;
      proxy_pass http://conteo;
    }

    location = /sw.js { add_header Cache-Control "no-cache"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location /vendor/ { expires 30d; }
    location / {
      try_files $uri /index.html;
    }
  }
}
